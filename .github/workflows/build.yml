name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Get whisper.cpp (speech engine)
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: whisper-model-ggml-base-v1

      - name: Download speech model (base, multilingual)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 -o app/src/main/assets/models/ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -lh app/src/main/assets/models

      - name: Cache Bengali model
        id: bn-cache
        uses: actions/cache@v4
        with:
          path: bn-model
          key: bn-model-anuragshas-small-q8_0-v1

      - name: Make Bengali model (download, convert, shrink)
        if: steps.bn-cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers<5" huggingface_hub numpy safetensors
          python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download
          snapshot_download("anuragshas/whisper-small-bn", local_dir="hf-bn",
                            allow_patterns=["*.json", "*.bin", "*.safetensors", "*.txt"])
          need = ["vocab.json", "added_tokens.json"]
          missing = [f for f in need if not os.path.exists(os.path.join("hf-bn", f))]
          if missing:
              snapshot_download("openai/whisper-small", local_dir="hf-base", allow_patterns=need)
              for f in missing:
                  shutil.copy(os.path.join("hf-base", f), os.path.join("hf-bn", f))
          print(sorted(os.listdir("hf-bn")))
          PY
          git clone --depth 1 https://github.com/openai/whisper openai-whisper
          mkdir -p bn-model
          python app/src/main/cpp/whisper.cpp/models/convert-h5-to-ggml.py hf-bn openai-whisper bn-model
          cmake -S app/src/main/cpp/whisper.cpp -B qbuild -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
          cmake --build qbuild --target whisper-quantize whisper-cli -j 4
          ./qbuild/bin/whisper-quantize bn-model/ggml-model.bin bn-model/ggml-small-bn-q8_0.bin q8_0
          rm bn-model/ggml-model.bin
          # Smoke test: the converted model must load and run.
          ./qbuild/bin/whisper-cli -m bn-model/ggml-small-bn-q8_0.bin -f app/src/main/cpp/whisper.cpp/samples/jfk.wav -l bn -nt
          ls -lh bn-model

      - name: Add Bengali model to app
        run: |
          cp bn-model/ggml-small-bn-q8_0.bin app/src/main/assets/models/
          ls -lh app/src/main/assets/models

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VoiceNotes.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-apk
          path: out/VoiceNotes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voice Notes build ${{ github.run_number }}
          body: Offline speech-to-text (English, বাংলা, हिंदी). Download VoiceNotes.apk below and install.
          files: out/VoiceNotes.apk
          make_latest: true
